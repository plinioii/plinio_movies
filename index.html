<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plinio Movies</title>
<style>
:root{--bg:#010101;--card:#141416;--tx:#efede8;--mu:#9a988f;--ac:#ee7a62;--bd:#2c2c31;--ok:#5fc08a;--no:#e0b050;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#010101;--card:#141416;--tx:#efede8;--mu:#9a988f;--ac:#ee7a62;--bd:#2c2c31;--ok:#5fc08a;--no:#e0b050}}
:root[data-theme="dark"]{--bg:#010101;--card:#141416;--tx:#efede8;--mu:#9a988f;--ac:#ee7a62;--bd:#2c2c31;--ok:#5fc08a;--no:#e0b050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px 8px;z-index:5;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.main{background:var(--ac);color:#fff;border:0;font-weight:600;padding:14px 22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:10px 12px 30px;max-width:760px;margin:0 auto}
.count{color:var(--mu);font-size:13px;margin:2px 2px 8px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
.t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.t small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin-top:2px}
.y{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--bd)}
.dot.si{background:var(--ok)}.dot.no{background:var(--no)}
.body{padding:0 14px 12px;font-size:14px;display:grid;gap:4px}
.body b{color:var(--mu);font-weight:500}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}
.empty h1{color:var(--tx);font-size:22px;margin:0 0 8px}
.gh{display:flex;justify-content:space-between;gap:10px;margin:16px 2px 6px;font-weight:700;color:var(--ac);font-size:15px}
.gh span{color:var(--mu);font-weight:500}
[hidden]{display:none!important}
.y{text-align:right}.st{color:var(--ac);letter-spacing:1px}
a{color:var(--ac)}
.fn{color:var(--mu);font-size:12px;margin-top:6px;overflow-wrap:anywhere}
body.lp{background:#010101;color:#f2f1ec}body.lp::before{background:#010101}
#landing{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:#010101;color:#f2f1ec}
.logo{width:min(86vw,60vh,520px);height:auto;display:block;animation:in .9s ease-out both}
#landing p{margin:0;color:#a3a29b;max-width:30ch}
.go{background:#86d62e;color:#0c1404;font-weight:700;font-size:18px;border:0;padding:15px 34px;border-radius:999px}
.go:focus-visible{outline:3px solid #f2f1ec;outline-offset:3px}
@keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
</style>

<script>
async function readXlsx(buf){
  const z=await JSZip.loadAsync(buf);
  const txt=async p=>{const f=z.file(p);return f?await f.async("string"):""};
  const un=s=>s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#x([0-9a-f]+);/gi,(m,n)=>String.fromCharCode(parseInt(n,16))).replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");
  const at=(a,n)=>{const m=a.match(new RegExp("\\b"+n+'="([^"]*)"'));return m?m[1]:""};
  const ts=x=>[...x.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(m=>m[1]).join("");
  const ss=[...(await txt("xl/sharedStrings.xml")).matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)].map(m=>un(ts(m[1])));
  const rel={};
  for(const m of (await txt("xl/_rels/workbook.xml.rels")).matchAll(/<Relationship\b([^>]*)>/g))rel[at(m[1],"Id")]=at(m[1],"Target");
  const out=[];
  for(const m of (await txt("xl/workbook.xml")).matchAll(/<sheet\b([^>]*)>/g)){
    const name=un(at(m[1],"name")),t=(rel[at(m[1],"r:id")]||"").replace(/^\//,"");
    const xml=await txt(t.startsWith("xl/")?t:"xl/"+t),cells={};let minR=1e9,maxC=0;
    for(const c of xml.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const ref=at(c[1],"r").match(/^([A-Z]+)(\d+)$/);if(!ref||!c[2])continue;
      let col=0;for(const ch of ref[1])col=col*26+ch.charCodeAt(0)-64;
      const row=+ref[2],ty=at(c[1],"t"),v=(c[2].match(/<v\b[^>]*>([\s\S]*?)<\/v>/)||[])[1];
      let val="";
      if(ty==="s")val=ss[+v]??"";
      else if(ty==="inlineStr")val=un(ts(c[2]));
      else if(v!=null)val=un(v);
      if(val==="")continue;
      (cells[row]??={})[col]=val;minR=Math.min(minR,row);maxC=Math.max(maxC,col);
    }
    const rows=[];
    if(minR<1e9){
      const head={};for(const c in cells[minR])head[c]=String(cells[minR][c]).trim();
      Object.keys(cells).map(Number).filter(r=>r>minR).sort((a,b)=>a-b).forEach(r=>{
        const o={};for(const c in cells[r])if(head[c])o[head[c]]=cells[r][c];rows.push(o);
      });
    }
    out.push({name,rows});
  }
  return out;
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let items=[],sheets=[],cur="Tutti",sn="all",grp="1";

async function parse(buf){
  const wb=await readXlsx(buf);
  sheets=wb.map(s=>s.name.replace(/\s*\(ok\)\s*/i,"").trim());
  items=[];
  wb.forEach((s,i)=>{
    s.rows.forEach(r=>{
      const o={sheet:sheets[i],actors:[],extra:[]};
      for(const k in r){
        const v=String(r[k]).trim(); if(!v) continue;
        const h=k.trim().toLowerCase();
        if(h==="anno")o.year=v;
        else if(h==="titolo")o.title=v;
        else if(h==="titolo originale")o.orig=v;
        else if(h==="stagione")o.season=v;
        else if(h.startsWith("regia"))o.dir=v;
        else if(h.startsWith("attore"))o.actors.push(v);
        else if(h==="lingua")o.lang=v;
        else if(h==="posizione")o.pos=v;
        else if(h==="visto"||h==="vista")o.seen=v.toUpperCase();
        else if(h==="voto"){const m=v.replace(",",".").match(/\d+(\.\d+)?/);if(m)o.vote=Math.max(0,Math.min(5,parseFloat(m[0])));}
        else o.extra.push([k.trim(),v]);
      }
      if(o.title){o.hay=fold([o.title,o.orig,o.dir,o.year,o.actors.join(" "),o.extra.map(e=>e[1]).join(" ")].join(" "));items.push(o);}
    });
  });
  items.sort((a,b)=>a.title.localeCompare(b.title,"it",{numeric:true}));
  cur="Tutti";sn="all";
  $("#start").hidden=true;$("#hd").hidden=false;
  tabs();render();
}

function chips(el,opts,get,set){
  el.innerHTML=opts.map(([v,l])=>`<button class="chip${get()===v?" on":""}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;set(b.dataset.v);tabs();render();};
}
function tabs(){
  const n=s=>items.filter(i=>s==="Tutti"||i.sheet===s).length;
  chips($("#tabs"),[["Tutti","Tutti ("+items.length+")"],...sheets.map(s=>[s,s+" ("+n(s)+")"])],()=>cur,v=>cur=v);
  chips($("#seen"),[["all","Tutti"],["SI","Visti"],["NO","Da vedere"]],()=>sn,v=>sn=v);
  $("#grpc").hidden=cur!=="Film"&&cur!=="Serie";
  chips($("#grpc"),[["1",cur==="Serie"?"Per titolo":"Per regista"],["0","Elenco A–Z"]],()=>grp,v=>grp=v);
}

function render(){
  const q=fold($("#q").value.trim()).split(/\s+/).filter(Boolean);
  const res=items.filter(i=>(cur==="Tutti"||i.sheet===cur)&&(sn==="all"||i.seen===sn)&&q.every(w=>i.hay.includes(w)));
  $("#cnt").textContent=res.length+(res.length===1?" risultato":" risultati");
  const row=(l,v)=>v?`<div><b>${l}:</b> ${esc(v)}</div>`:"";
  const stars=n=>"★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));
  const names=s=>s.split(",").flatMap(p=>{p=p.trim();const m=p.match(/^(.+?)\s+(?:e|&|and)\s+(.+)$/);return m&&m[1].trim().split(/\s+/).length>1&&m[2].trim().split(/\s+/).length>1?[m[1],m[2]]:[p]}).map(n=>n.trim()).filter(Boolean);
  const wl=s=>names(s).map(n=>`<a href="https://it.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(n)}&amp;go=Vai" target="_blank" rel="noopener">${esc(n)}</a>`).join(", ");
  const gs=cur==="Serie"&&grp==="1";
  const card=i=>`<details><summary>
    <span class="dot ${i.seen==="SI"?"si":i.seen==="NO"?"no":""}"></span>
    <span class="t">${esc(gs?(i.season||"Serie"):i.title)}<small>${gs?"":esc(i.sheet)+(i.season?" · "+esc(i.season):"")+(i.dir?" · ":"")}${i.dir?esc(i.dir):""}</small></span>
    <span class="y">${esc(i.year||"")}${i.vote!=null?`<br><span class="st">${stars(i.vote)}</span>`:""}</span></summary>
    <div class="body">${row("Titolo originale",i.orig)}${row("Stagione",i.season)}${i.dir?`<div><b>Regia:</b> ${wl(i.dir)}</div>`:""}${row("Attori",i.actors.join(", "))}${row("Lingua",i.lang)}${row("Posizione",i.pos)}${row("Visto",i.seen==="SI"?"sì":i.seen==="NO"?"no":i.seen)}${i.vote!=null?`<div><b>Voto:</b> <span class="st">${stars(i.vote)}</span> ${String(i.vote).replace(".",",")}/5</div>`:""}${i.extra.map(e=>row(e[0],e[1])).join("")}</div></details>`;
  if(gs){
    const g={},nm={};
    res.forEach(i=>{const k=fold(i.title).replace(/\s+/g," ");nm[k]=nm[k]||i.title;(g[k]??=[]).push(i);});
    $("#list").innerHTML=Object.keys(g).sort((a,b)=>nm[a].localeCompare(nm[b],"it",{numeric:true})).map(k=>`<div class="gh"><span style="color:inherit;font-weight:inherit"><a href="https://it.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(nm[k]+" serie televisiva")}" target="_blank" rel="noopener">${esc(nm[k])}</a></span><span>${g[k].length>1?g[k].length+" stagioni":""}</span></div>`+g[k].sort((a,b)=>(a.year||"").localeCompare(b.year||"")||(a.season||"").localeCompare(b.season||"","it",{numeric:true})).map(card).join("")).join("");
  }else if(cur==="Film"&&grp==="1"){
    const g={};
    res.forEach(i=>(g[i.dir||"Regista non indicato"]??=[]).push(i));
    $("#list").innerHTML=Object.keys(g).sort((a,b)=>a.localeCompare(b,"it")).map(k=>`<div class="gh"><span style="color:inherit;font-weight:inherit">${k==="Regista non indicato"?esc(k):wl(k)}</span><span>${g[k].length}</span></div>`+g[k].sort((a,b)=>(a.year||"").localeCompare(b.year||"")).map(card).join("")).join("");
  }else{
    $("#list").innerHTML=res.slice(0,300).map(card).join("")+(res.length>300?`<div class="count">Mostrati i primi 300: affina la ricerca.</div>`:"");
  }
}

const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open("catalogo",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko()});
async function save(buf,name,t){try{const d=await idb();const s=d.transaction("f","readwrite").objectStore("f");s.put(buf,"last");s.put(name,"name");s.put(t,"date");}catch(e){}}
async function last(k="last"){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction("f").objectStore("f").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}

const setName=(n,t)=>{$("#fn").textContent=n?"📄 "+n+(t?" · caricato il "+new Date(t).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}):""):"";};
const show=on=>{$("#landing").hidden=!on;$("#app").hidden=on;document.body.classList.toggle("lp",on);scrollTo(0,0)};
$("#enter").onclick=()=>show(false);$("#home").onclick=()=>show(true);
const fi=$("#file");
$("#pick").onclick=$("#chg").onclick=()=>fi.click();
fi.onchange=async()=>{const f=fi.files[0];if(!f)return;const buf=await f.arrayBuffer();try{const t=Date.now();await parse(buf);setName(f.name,t);save(buf,f.name,t);}catch(e){alert("Non riesco a leggere questo file.");}fi.value="";};
$("#q").oninput=render;
last().then(async b=>{if(b){try{await parse(b);setName(await last("name"),await last("date"));}catch(e){}}});
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
